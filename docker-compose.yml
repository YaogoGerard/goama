# Goama — stack complète en une commande :   docker compose up
#
# Premier lancement : les images sont construites en mode production,
# les migrations sont appliquées, puis l'amorçage provisionne
# automatiquement 1 administrateur et 3 agents de démonstration
# (backend/DEMO_ACCOUNTS.md) et affiche leurs secrets TOTP dans les
# journaux :   docker compose logs api
#
# Aucun fichier .env n'est requis : les secrets applicatifs sont
# générés au premier démarrage de l'API et persistés dans le volume
# « config ». Le mot de passe PostgreSQL n'est présent que sur le
# réseau interne Docker (la base n'est pas publiée sur l'hôte).
# Les variables ${...} restent surchargeables par un .env optionnel
# (ports, origines CORS, URL publiques).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goama_postgres_interne_local}
      POSTGRES_DB: ${POSTGRES_DB:-goama}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-goama} -d $${POSTGRES_DB:-goama}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-goama}:${POSTGRES_PASSWORD:-goama_postgres_interne_local}@db:5432/${POSTGRES_DB:-goama}
      FILES_DIR: /data/files
      PORT: 8080
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:5173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      # Fournis par un .env optionnel pour provisionner un administrateur
      # avec des identifiants choisis (voir backend/src/bootstrap-accounts.ts).
      ADMIN_MATRICULE: ${ADMIN_MATRICULE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      - filedata:/data/files
      - config:/config
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      # Dockerfile propagé hors de web/ (deploy/web.Dockerfile) :
      # web/ reste intact, exactement tel que pullé du dépôt distant.
      dockerfile: ../deploy/web.Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  filedata:
  config:
