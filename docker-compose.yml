# Goama — déploiement conteneurisé, lancement en une commande :
#   docker compose up --build
# Au premier démarrage, les secrets applicatifs sont générés dans un volume
# partagé (stables aux redémarrages) et une copie lisible est écrite dans le
# fichier .env à la racine du dépôt (non versionné, autorisations 600).
# Le service setup affiche en fin de démarrage les identifiants des comptes
# de démonstration (il refuse toute configuration autre que localhost) et les
# conserve dans .identifiants-demo ; l'API et les journaux d'audit n'en
# contiennent aucun.
# Pour une installation sur un domaine HTTPS public, préparer le .env avec
# ses propres secrets (voir docs/DEPLOIEMENT_SECURITE.md).

services:
  init-secrets:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/scripts/init-secrets.sh"]
    command: []
    environment:
      # Écrit le fichier .env non versionné à la racine du dépôt (one-shot,
      # exécution uniquement locale — voir docs/DEPLOIEMENT_SECURITE.md).
      ENV_FILE_DIR: /depot-hote
      LOCAL_UID: ${HOST_UID:-1000}
      LOCAL_GID: ${HOST_GID:-1000}
    volumes:
      - secrets-data:/run/goama-secrets
      - .:/depot-hote
    restart: "no"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goama}
      POSTGRES_DB: ${POSTGRES_DB:-goama}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets-data:/run/secrets:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-goama} -d $${POSTGRES_DB:-goama}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:-goama}
      POSTGRES_DB: ${POSTGRES_DB:-goama}
      TRUST_PROXY: ${TRUST_PROXY:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      ADMIN_MATRICULE: ${ADMIN_MATRICULE:-ADMIN001}
      FILES_DIR: /data/files
      PORT: 8080
      MEDIA_MAX_BYTES_PER_GROUP: ${MEDIA_MAX_BYTES_PER_GROUP:-1073741824}
      MEDIA_MAX_BYTES_PER_AGENT: ${MEDIA_MAX_BYTES_PER_AGENT:-268435456}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:5173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    volumes:
      - filedata:/data/files
      - secrets-data:/run/secrets:ro
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  setup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/setup-local-demo.js"]
    environment:
      NODE_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:-goama}
      POSTGRES_DB: ${POSTGRES_DB:-goama}
      TRUST_PROXY: ${TRUST_PROXY:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      ADMIN_MATRICULE: ${ADMIN_MATRICULE:-ADMIN001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:5173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      ENV_FILE_DIR: /depot-hote
      LOCAL_UID: ${HOST_UID:-1000}
      LOCAL_GID: ${HOST_GID:-1000}
    volumes:
      - secrets-data:/run/secrets:ro
      - .:/depot-hote
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: ../deploy/web.Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  filedata:
  secrets-data:
