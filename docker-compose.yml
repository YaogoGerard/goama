services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Exécutez ./setup.sh pour générer un secret PostgreSQL}
      POSTGRES_DB: ${POSTGRES_DB:-goama}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-goama} -d $${POSTGRES_DB:-goama}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-goama}:${POSTGRES_PASSWORD:?Exécutez ./setup.sh pour générer un secret PostgreSQL}@db:5432/${POSTGRES_DB:-goama}
      NODE_ENV: ${NODE_ENV:-development}
      FILES_DIR: /data/files
      PORT: 8080
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:5173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      - filedata:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      # Dockerfile propagé hors de web/ (deploy/web.Dockerfile) :
      # web/ reste intact, exactement tel que pullé du dépôt distant.
      dockerfile: ../deploy/web.Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  filedata:
