name: Validation Goama

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — migrations et tests isolés
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types
        run: npm run typecheck
      - name: Exécuter la suite PostgreSQL isolée
        run: npm run test:isolated

  web:
    name: Web — build et Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Construire le frontend
        run: npm run build
      - name: Exécuter les tests web
        run: npm run test:e2e

  admin:
    name: Administration — build et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Construire l’interface
        run: npm run build
      - name: Exécuter les tests admin
        run: npm run test:e2e
